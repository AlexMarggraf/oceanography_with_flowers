project_name: "cn_unet"
epochs: 20
batch_size: 4

model:
  _target_: __main__.CNUnet
  dim_in: 17
  dim_out: 10
  stages: 4
  blocks_per_stage: 2
  blocks_at_neck: 1
  init_features: 42

loss_fn:
  _target_: torch.nn.MSELoss
  
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3

warmup_scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  start_factor: 0.01
  end_factor: 1.0

decay_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  eta_min: 1.0e-6

scheduler:
  _target_: torch.optim.lr_scheduler.SequentialLR
