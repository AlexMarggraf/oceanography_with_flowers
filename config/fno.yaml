project_name: "fno"
epochs: 10
batch_size: 8

model:
  _target_: __main__.Pactcs30Fno
  start_channels: 15
  end_channels: 8
  hidden_channels: 128
  modes: 32
  layers: 4

loss_fn:
  _target_: torch.nn.MSELoss
  
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001

warmup_scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  start_factor: 0.01
  end_factor: 1.0

decay_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  eta_min: 1.0e-6

scheduler:
  _target_: torch.optim.lr_scheduler.SequentialLR