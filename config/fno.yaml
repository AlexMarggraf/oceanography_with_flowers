project_name: "fno"
epochs: 3
batch_size: 16

model:
  _target_: __main__.Pactcs30Fno
  start_channels: 15
  end_channels: 8
  hidden_channels: 64
  modes: 64
  layers: 4

loss:
  _target_: torch.nn.L1Loss
  
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001

warmup_scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  start_factor: 0.01
  end_factor: 1.0
  total_iters: 100

decay_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 900
  eta_min: 1.0e-6

scheduler:
  _target_: torch.optim.lr_scheduler.SequentialLR
  milestones: [100]
  