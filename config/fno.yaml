project_name: "fno_rollout"
epochs: 15
batch_size: 4

model:
  _target_: __main__.Pactcs30FNO
  start_channels: 17
  end_channels: 10
  hidden_channels: 180
  modes: 16
  layers: 4

loss_fn:
  _target_: torch.nn.MSELoss
  
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.001

warmup_scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  start_factor: 0.01
  end_factor: 1.0

decay_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  eta_min: 1.0e-6

scheduler:
  _target_: torch.optim.lr_scheduler.SequentialLR
