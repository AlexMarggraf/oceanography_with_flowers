project_name: "scot"
model_name: "scot"
epochs: 5
batch_size: 4
acc_steps: 4

model:
  _target_: __main__.ScOT
  dim_in: 17
  dim_out: 10
  patch_size: 4
  embed_dim: 32
  depths: [8, 8, 8, 8]
  num_heads: [2, 4, 8, 16]
  skip_connections: [1, 1, 1]  # Number of residual blocks per stage
  window_size: 7
  mlp_ratio: 4.0
  qkv_bias: true
  hidden_dropout_prob: 0.0
  attention_probs_dropout_prob: 0.0
  drop_path_rate: 0.1
  hidden_act: "gelu"
  use_absolute_embeddings: false
  layer_norm_eps: 1e-5
  residual_model: "convnext"  # "convnext" or "resnet"
  dim_meta: 0
  learn_residual: false
  use_mask_token: false

loss_fn:
  _target_: torch.nn.MSELoss
  
optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-4
  weight_decay: 1.0e-6

warmup_scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  start_factor: 0.01
  end_factor: 1.0

decay_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  eta_min: 1.0e-6

scheduler:
  _target_: torch.optim.lr_scheduler.SequentialLR