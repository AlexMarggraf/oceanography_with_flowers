project_name: "rollout" # the weights and biases project name
model_name: "gaot"
epochs: 20
batch_size: 4

model:
  name: "gaot"
  latent_tokens_size: [256, 256] # how many latent gridpoints to use, higher means finer details in final image
  dim_in: 17
  dim_out: 10
  args:
    magno:
      radius: 0.00825 # how large the radius is for the geometric embeddings, make sure to get full coverage of the data
      hidden_size: 256
      embedding_method: "pointnet" # use pointnet or geometric embeddings
    transformer:
      patch_size: 2
      hidden_size: 256
      num_layers: 5

loss_fn:
  _target_: torch.nn.MSELoss
  
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-3
  weight_decay: 1.0e-5

warmup_scheduler:
  _target_: torch.optim.lr_scheduler.LinearLR
  start_factor: 0.8
  end_factor: 1.0

decay_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  eta_min: 5.0e-5

scheduler:
  _target_: torch.optim.lr_scheduler.SequentialLR