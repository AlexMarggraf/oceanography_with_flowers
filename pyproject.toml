[project]
name = "oceanography_with_flowers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cmocean>=4.0.3",
    "hydra-core>=1.3.7",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "neuraloperator>=2.0.0",
    "numpy>=2.2.6",
    "omegaconf>=2.3.1",
    "pandas>=2.3.3",
    "pathlib>=1.0.1",
    "torch>=2.14.1",
    "wandb>=0.30.0",
    "xarray>=2025.6.1",
    "xcmocean>=0.3.2",
    "xroms>=0.6.2",
    "zarr>=2.18.3",
]

[project.scripts]
train = "oceanography_with_flowers.train:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oceanography_with_flowers"
module-root = ""
